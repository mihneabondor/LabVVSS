# Define the default driver
webdriver.driver = safari

# Appears at the top of the reports
serenity.project.name = Busify Tests

# Safari doesn't support headless mode
headless.mode = false

# Root package for your tests
serenity.test.root = org.example.Tests

# Wait longer for React content to load (in milliseconds)
webdriver.timeouts.implicitlywait = 10000